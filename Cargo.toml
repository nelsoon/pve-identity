[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
